spring.application.name=clone

# ==============================================================================
# Database Configuration (PostgreSQL)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/amazon_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1111}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
# In production & Flyway-managed databases, validate schema matches entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================================
# Flyway Migration Configuration
# ==============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
